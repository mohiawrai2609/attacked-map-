<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <!-- Brand faces are self-hosted (public/fonts, declared in src/styles/fonts.css)
         since the 2026-09-29 brand system: the same Inter 400-800 and JetBrains
         Mono 400-600 that Google served, minus the third-party round trip. The
         stylesheet registers with the JS bundle, so the two faces used at first
         paint are preloaded here to avoid a flash of fallback type. -->
    <link rel="preload" as="font" type="font/woff2" href="/fonts/inter-400.woff2" crossorigin />
    <link rel="preload" as="font" type="font/woff2" href="/fonts/inter-600.woff2" crossorigin />
    <title>Attacked.ai™ · Global Attack Map</title>
    <!-- CesiumJS (loaded from CDN so it needs no local install) — powers the 3D satellite globe -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cesium/1.104.0/Widgets/widgets.css" />
    <script>window.CESIUM_BASE_URL = "https://cdnjs.cloudflare.com/ajax/libs/cesium/1.104.0/";</script>
    <script defer src="https://cdnjs.cloudflare.com/ajax/libs/cesium/1.104.0/Cesium.js"></script>
    <style>
      html, body, #root { height: 100%; margin: 0; background: #0E1116; color: #FFFFFF; font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif; }
      *, *::before, *::after { box-sizing: border-box; }
      /* Form controls do not inherit the page font by default; without this the
         navbar buttons rendered in Arial. Brand: Inter everywhere. */
      button, input, select, textarea, optgroup { font-family: inherit; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
